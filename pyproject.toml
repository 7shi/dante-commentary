[project]
name = "dante-commentary"
version = "0.1.0"
description = "Generates Japanese commentary articles for cantos of Dante's Divina Commedia via an LLM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dante-corpus",
    "llm7shi",
]

[tool.uv.sources]
llm7shi = { git = "https://github.com/7shi/llm7shi.git" }
dante-corpus = { path = "../dante-corpus", editable = true }
