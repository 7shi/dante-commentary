<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ canticle_label }} — 神曲 対訳注釈</title>
    <link rel="stylesheet" href="{{ base }}assets/style.css">
</head>
<body>
    <div class="layout">
        {% include "_sidebar.html" %}
        <main class="content">
            <div class="container">
                <header class="page-header">
                    <h1>{{ canticle_label }}</h1>
                </header>

                <ul class="canto-list">
                    {% for c in cantos %}
                    <li>
                        <a href="{{ base }}{{ c.href }}">第{{ c.number }}歌</a>
                        {% if c.title %}<span class="canto-list-title">{{ c.title }}</span>{% endif %}
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </main>
    </div>
</body>
</html>
